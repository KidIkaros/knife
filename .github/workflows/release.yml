name: release

on:
  push:
    tags: ["v*"]
  # Manual fallback: tag pushes do not always start a run, so a release can
  # be built on demand with `gh workflow run release.yml --ref vX.Y.Z`.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu, ext: "",     fmt: tgz }
          - { os: macos-latest,   target: x86_64-apple-darwin,      ext: "",     fmt: tgz }
          - { os: macos-latest,   target: aarch64-apple-darwin,     ext: "",     fmt: tgz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   ext: ".exe", fmt: zip }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/knife${{ matrix.ext }}"
          name="knife-${{ matrix.target }}"
          mkdir -p dist staging
          cp "$bin" LICENSE README.md staging/
          if [ "${{ matrix.fmt }}" = "zip" ]; then
            (cd staging && 7z a "../dist/${name}.zip" .)
          else
            tar -czf "dist/${name}.tgz" -C staging .
          fi
      # The notes are this release's CHANGELOG section. Without a body every
      # matrix job asked GitHub to generate one and appended it, so the release
      # for 1.7.0 went out with a compare link repeated four times and not one
      # word about what had changed. Each job now writes the same body, so it
      # does not matter which of them gets there first.
      - name: release notes from the changelog
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 == "## v" v { found = 1; next }
            found && /^## v/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "no CHANGELOG section for $GITHUB_REF_NAME" >&2
            exit 1
          fi
          printf '
**Full Changelog**: https://github.com/%s/compare/%s
'             "$GITHUB_REPOSITORY" "$(git describe --abbrev=0 --tags "${GITHUB_REF_NAME}^" 2>/dev/null || echo '')...${GITHUB_REF_NAME}" >> notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
