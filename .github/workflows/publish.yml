name: publish

on:
  push:
    tags: ["v*"]
  # Manual fallback: `gh workflow run publish.yml --ref vX.Y.Z`.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu, ext: "",     fmt: tgz }
          - { os: macos-latest,   target: x86_64-apple-darwin,      ext: "",     fmt: tgz }
          - { os: macos-latest,   target: aarch64-apple-darwin,     ext: "",     fmt: tgz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   ext: ".exe", fmt: zip }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/knife${{ matrix.ext }}"
          name="knife-${{ matrix.target }}"
          mkdir -p dist staging
          cp "$bin" LICENSE README.md staging/
          if [ "${{ matrix.fmt }}" = "zip" ]; then
            (cd staging && 7z a "../dist/${name}.zip" .)
          else
            tar -czf "dist/${name}.tgz" -C staging .
          fi
      # The notes are this release's CHANGELOG section. Every matrix job
      # writes the same body, so it does not matter which one gets there
      # first; the awk lives in scripts/ because inline kept tripping the
      # workflow loader.
      - name: release notes from the changelog
        shell: bash
        run: bash scripts/release-notes.sh "${GITHUB_REF_NAME#v}"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
